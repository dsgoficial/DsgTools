[qgis-plugin-ci]
plugin_path = DsgTools
github_organization_slug = dsgoficial
project_slug = DsgTools
changelog_include = True

[flake8]
max-line-length = 88
# W503/E203 conflict with black's formatting choices (line break before
# binary operator, whitespace before ':' in slices).
extend-ignore = W503, E203
exclude =
    .git,
    __pycache__,
    resources.py,
    DsgTools/gui/LayerTools/CreateFrameTool/ui_create_inom_dialog.py
per-file-ignores =
    # re-export modules commonly import names only to expose them
    */__init__.py: F401
