[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Test* Tester
python_functions = test_*
addopts = --no-header -v
# pytest-qgis: run headless, disable GUI canvas
qgis_gui_enabled = false
# Test markers
markers =
    unit: pure unit tests with no external dependencies
    integration: tests that run full QGIS processing algorithms
